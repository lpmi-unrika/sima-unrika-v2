<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SIMA UNRIKA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-8 border border-slate-200">
    <div class="text-center mb-8">
      <div id="loginLogoContainer" class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-blue-900 text-white font-bold text-2xl mb-4 shadow overflow-hidden">
        S
      </div>
      <h1 id="loginAppTitle" class="text-2xl font-bold text-slate-800">SIMA UNRIKA</h1>
      <p id="loginAppSubtitle" class="text-sm text-slate-500 mt-1">Sistem Informasi Manajemen Administrasi &amp; Inventaris Terpadu</p>
    </div>

    <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-sm bg-red-50 text-red-700 border border-red-200"></div>

    <form id="loginForm" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email Akun</label>
        <input type="email" id="email" required placeholder="Masukkan email terdaftar"
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-800 focus:border-blue-800 outline-none transition">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Kata Sandi</label>
        <input type="password" id="password" required placeholder="••••••••"
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-800 focus:border-blue-800 outline-none transition">
      </div>

      <button type="submit" id="btnLogin"
        class="w-full bg-blue-900 hover:bg-blue-800 text-white font-semibold py-2.5 rounded-lg shadow transition duration-200">
        Masuk ke Sistem
      </button>
    </form>

    <p class="text-center text-xs text-slate-400 mt-8">
      &copy; 2026 SIMA - Sistem Informasi Manajemen Administrasi Terpadu.
    </p>
  </div>

  <script>
    const SUPABASE_URL = 'https://prbxzgplgphvnwgnfhon.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByYnh6Z3BsZ3Bodm53Z25maG9uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwODEyOTMsImV4cCI6MjExMDY1NzI5M30.v3eDXKjtSaH0Ypt2zx-lF_tgsWVmhRWQ3AGRRX8vYMI';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Muat pengaturan logo jika pernah disimpan di perangkat
    const savedLogo = localStorage.getItem('sima_custom_logo');
    const savedTitle = localStorage.getItem('sima_custom_title');
    if (savedLogo) {
      document.getElementById('loginLogoContainer').innerHTML = `<img src="${savedLogo}" alt="Logo" class="w-full h-full object-contain bg-white p-1">`;
    }
    if (savedTitle) {
      document.getElementById('loginAppTitle').textContent = savedTitle;
    }

    sb.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = 'dashboard.html';
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btnLogin');
      const alertBox = document.getElementById('alertBox');

      btn.disabled = true;
      btn.textContent = 'Memverifikasi...';
      alertBox.classList.add('hidden');

      const { data, error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        alertBox.textContent = 'Login gagal: ' + error.message;
        alertBox.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Masuk ke Sistem';
        return;
      }

      const { data: profile, error: profErr } = await sb
        .from('profiles')
        .select('status_aktif')
        .eq('id', data.user.id)
        .single();

      if (profErr) {
        alertBox.textContent = 'Gagal membaca profil: ' + profErr.message;
        alertBox.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Masuk ke Sistem';
        return;
      }

      if (profile && profile.status_aktif === false) {
        await sb.auth.signOut();
        alertBox.textContent = 'Akun Anda telah dinonaktifkan oleh Admin.';
        alertBox.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Masuk ke Sistem';
        return;
      }

      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
